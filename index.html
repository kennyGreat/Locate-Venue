<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Matchmaker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c5c4e">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#12232b;--mut:#5b6b72;--line:#d6dedb;--bg:#eef1ee;--card:#fff;--ac:#0c5c4e;--ac2:#dcebe6;--amb:#c98a12;--amb2:#f7ecd2;--brick:#a8392a;--brick2:#f6e1dd}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;justify-content:space-between;align-items:baseline;padding:calc(14px + env(safe-area-inset-top,0px)) 0 6px}
header.top b{font-size:15px;font-weight:700;letter-spacing:-.1px}
header.top span{font-size:12.5px;color:var(--mut)}
h1{font-size:26px;line-height:1.15;letter-spacing:-.6px;margin:14px 0 6px;font-weight:750}
h2{font-size:17px;margin:22px 0 8px;font-weight:700;letter-spacing:-.2px}
.lead{color:var(--mut);margin:0 0 18px;font-size:15px}
.fld{padding:16px 0;border-top:1px solid var(--line)}
.fld:first-of-type{border-top:0}
.fld>label,.q{display:block;font-weight:650;font-size:15.5px;margin-bottom:8px}
.fld>label i,.q i{font-style:normal;font-weight:400;color:var(--mut)}
.sub{display:block;font-size:13.5px;color:var(--mut);font-weight:400;margin:-4px 0 8px}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
input,select,textarea{width:100%;min-height:50px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px;outline:none}
textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(12,92,78,.14)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid rgba(12,92,78,.45);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.wide{grid-template-columns:1.4fr 1fr}
.pair{margin-top:10px}
.pair label{display:block;font-size:14px;color:var(--ink);margin-bottom:5px;font-weight:600}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.tog button{min-height:54px;border:0;background:#fff;font-weight:700;font-size:16px;cursor:pointer}
.tog button+button{border-left:1.5px solid var(--ink)}
.tog button.on{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--brick);border-color:#e4bdb6}
.btn:active{transform:translateY(1px)}
.err{background:var(--brick2);color:var(--brick);border-radius:10px;padding:10px 13px;font-size:14px;margin:14px 0 0}
.ok{background:var(--ac2);color:var(--ac);border-radius:10px;padding:10px 13px;font-size:14px;margin:12px 0}
.bad .tog,.bad input,.bad select{border-color:var(--brick)}
.recap{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;margin:12px 0}
.recap b{display:block;font-size:17px;letter-spacing:-.2px}
.recap span{display:block;font-size:14px;opacity:.82;margin-top:2px}
.recap .acts{display:flex;gap:8px;margin-top:12px}
.recap .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:650;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.note{font-size:13.5px;color:var(--mut);margin:8px 0}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.match .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.match h3{margin:0;font-size:17px;line-height:1.25;letter-spacing:-.2px}
.match .where{font-size:14px;color:var(--mut);margin-top:2px}
.match .price{font-weight:700;margin-top:6px}
.score{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;text-align:right}
.score small{font-size:15px;font-weight:700}
.score.hi{color:var(--ac)}.score.mid{color:var(--amb)}.score.lo{color:var(--brick)}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px}
.cell .bar{display:block;height:8px;border-radius:4px;background:#e6ebe9;overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--ac)}
.cell.part .bar i{background:var(--amb)}
.cell b{display:block;font-size:12.5px;margin-top:5px}
.cell em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
details{margin-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--ac);min-height:32px;display:flex;align-items:center}
.why{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.why li{padding:6px 0 6px 24px;position:relative;border-top:1px solid #edf1ef}
.why li:before{content:"✓";position:absolute;left:3px;color:var(--ac);font-weight:800}
.why li.p:before{content:"~";color:var(--amb)}
.why li.n:before{content:"✗";color:var(--brick)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.asof{font-size:13px;color:var(--mut);margin:4px 0 0}.asof.old{color:#8a5a00}.read{font-size:14px;margin:10px 0 0}
.empty{text-align:center;padding:34px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ac2);color:var(--ac);margin-right:6px}
.tag.rent{background:var(--amb2);color:#7a5200}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;margin:10px 0 14px}
.sw.two{grid-template-columns:1fr 1fr}
.sw button{min-height:46px;border:0;background:#fff;font-weight:700;font-size:14px;cursor:pointer;padding:4px 6px;line-height:1.2}
.sw button+button{border-left:1.5px solid var(--ink)}
.sw button.on{background:var(--ink);color:#fff}
.draft{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.draft .src{font-size:13.5px;color:var(--mut);display:flex;gap:10px;align-items:flex-start}
.draft .src input{width:22px;min-height:22px;margin-top:3px;flex:none}
.draft .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.draft .grid .full{grid-column:1/-1}
.draft label{display:block;font-size:12.5px;font-weight:650;color:var(--mut);margin-bottom:3px}
.draft input,.draft select,.draft textarea{min-height:44px;font-size:15px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.item h3{margin:0;font-size:16px;letter-spacing:-.15px}
.item p{margin:3px 0 0;font-size:14px;color:var(--mut)}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.bar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.bar button{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:650;color:var(--mut);cursor:pointer}
nav.bar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar button.on{color:var(--ac)}
nav.bar button{position:relative;font-size:10.5px;padding:0 1px}
.bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--brick);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
header.top .hr{display:flex;align-items:center;gap:10px}
.gear{border:0;background:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);margin-right:-8px}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sync{font-size:12px;font-weight:650;white-space:nowrap}.sync.s-ok{color:var(--ac)}.sync.s-off{color:var(--amb)}.sync.s-busy{color:var(--mut)}
header.top b{white-space:nowrap}
@media (max-width:430px){#count{display:none}}
.code{display:block;word-break:break-all;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:13.5px/1.4 ui-monospace,Menlo,Consolas,monospace;user-select:all}
.mrow{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:10px}
.mrow label{display:block;font-size:12.5px;font-weight:650;color:var(--mut)}
.mrow select,.mrow input{min-height:44px;font-size:15px;margin-top:3px}
.match.dim{opacity:.78;background:#f6f8f7}
.mstrip{display:flex;gap:6px;margin:10px 0 2px;overflow-x:auto}
.mth{position:relative;flex:none;width:76px;height:76px;border:0;padding:0;border-radius:10px;overflow:hidden;background:#dfe6e3;cursor:pointer}
.mth.on{outline:3px solid var(--ac)}
.mimg{width:100%;height:100%;object-fit:cover;display:block}
.play,.more{position:absolute;font-style:normal;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.play{left:6px;bottom:4px}.more{right:6px;bottom:4px;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 6px}
#sheet .scrim{position:fixed;inset:0;background:rgba(10,20,25,.55);z-index:30}
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;z-index:31;padding-bottom:env(safe-area-inset-bottom,0px)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.shead b{font-size:16px;line-height:1.25}
.sbody{overflow:auto;padding:14px 16px 20px}
.mview{background:#0c1519;border-radius:12px;overflow:hidden;margin-bottom:10px}
.mview img,.mview video{display:block;width:100%;max-height:52vh;object-fit:contain}
.mrail{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.linkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}.chk input{width:22px;min-height:22px}
.clip{word-break:break-all}
.btn[disabled]{opacity:.45;cursor:default}
.alt .sent{font-size:16px;line-height:1.4;font-weight:650;margin:4px 0 0}
.rank{display:inline-block;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.3px}
.altd{margin:12px 0 4px}.altd>summary{font-size:15px}
h2+.note{margin-top:0}
.grp{margin:18px 0 6px}
input[type=search]{margin:4px 0 8px}
@media (min-width:700px){.app{padding-top:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="app">
 <header class="top"><b>Property Matchmaker</b><div class="hr"><span id="sync" class="sync" role="status"></span><span id="count"></span><button class="gear" onclick="go('search')" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="gear" onclick="go('set')" aria-label="Settings and sync"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></header>
 <main id="v"></main>
</div>
<nav class="bar" aria-label="Main"><div id="nav"></div></nav>
<script>
/*CORE*/
const COUNTRIES=["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Croatia","Cuba","Cyprus","Czechia","Democratic Republic of the Congo","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Ivory Coast","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];
const NG_STATES=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT Abuja","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const CURR_ALL=(()=>{try{return Intl.supportedValuesOf('currency')}catch(e){return['NGN','USD','GBP','EUR','CAD','AUD','ZAR','GHS','KES','AED','INR','CNY','JPY']}})();
const TOPC=['NGN','USD','GBP','EUR','GHS','KES','ZAR','AED','CAD'];
const CURR=TOPC.concat(CURR_ALL.filter(c=>!TOPC.includes(c)));
let DN=null;try{DN=new Intl.DisplayNames(['en'],{type:'currency'})}catch(e){}
const curLabel=c=>{let n='';try{n=DN?DN.of(c):''}catch(e){}return n&&n!==c?c+' ('+n+')':c};
const money=(n,c)=>{n=Number(n)||0;try{return new Intl.NumberFormat('en',{style:'currency',currency:c||'NGN',currencyDisplay:'narrowSymbol',maximumFractionDigits:0}).format(n)}catch(e){return (c||'')+' '+n.toLocaleString()}};

/* Property types */
const KINDS=[['duplex','Duplex'],['bungalow','Bungalow'],['flat','Flat / apartment'],['block','Block of flats / apartments'],['self-contain','Self-contain / room'],['terrace','Terrace'],['land','Land / plot'],['commercial','Commercial (shop, office, warehouse)'],['other','Other']];
const kl=k=>(KINDS.find(x=>x[0]===k)||[0,k||''])[1].toLowerCase();
const BLOCK_RE=/\bblocks? of (?:\w+ ){0,3}(?:flats?|apartments?|units?|self.?contain(?:ed)?s?|rooms)\b|\b(?:\d{1,3}|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\s*(?:no\.?\s*)?(?:units?\s+of\s+)?(?:\d{1,2}[- ]?bed(?:room)?s?\s+)?(?:flats|apartments)\b|(?:apartment|flats?|residential) (?:complex|building)|multi.?(?:unit|family)/;
const KN=[['block',BLOCK_RE],['self-contain',/self.?contain|mini.?flat|single room|room (?:and|&) parlou?r/],['terrace',/terrace/],['duplex',/duplex|maisonette|mansion|semi.?detached|detached house|(?:storey|story|storied) (?:house|building)/],['bungalow',/bungalow/],['flat',/\bflats?\b|apartment|penthouse/],['commercial',/\b(?:shops?|offices?|warehouse|plaza|event cent(?:er|re)|hotel|filling station|showroom)\b|commercial (?:property|building|plot)/],['land',/\bland\b|\bplots?\b|farm ?land|hectares?|\bacres?\b/]];
const kindOf=t=>{t=String(t||'').toLowerCase();for(const k of KN)if(k[1].test(t))return k[0];return ''};
const kindsIn=t=>{t=String(t||'').toLowerCase();const m=KN.filter(k=>k[1].test(t)).map(k=>k[0]);return m.includes('block')?m.filter(k=>k!=='flat'&&k!=='self-contain'):m};

/* Transaction category: two categories only. BUY = to buy / for sale. RENT = to rent / for rent / to let / for let. */
function normTx(v){
 const t=String(v||'').toLowerCase().replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
 if(!t)return '';
 if(/^(to buy|buy|for sale|sale|purchase|to purchase)$/.test(t))return 'buy';
 if(/^(to rent|rent|for rent|to let|for let|let|for letting|letting|rental|lease|for lease|to lease)$/.test(t))return 'rent';
 const rent=/\b(for rent|to rent|to let|for let|for letting|rent|rental|rented|lease|leasing|tenant|let out|letting)\b/.test(t);
 const buy=/\b(for sale|to buy|buy|buying|buyer|purchase|purchasing|selling|sell|sale)\b/.test(t);
 if(rent===buy)return '';
 return rent?'rent':'buy';
}
const txLabel=t=>t==='rent'?'To rent':t==='buy'?'To buy':'';

/* Text readers */
const PH=/(?:\+?234|\b0)[789]\d[\d\s-]{7,10}\d/;
const WN={one:1,two:2,three:3,four:4,five:5,six:6};
const bedsOf=t=>{const m=String(t||'').match(/\b(\d|one|two|three|four|five|six)\s*[- ]?\s*(?:bed(?:room)?s?|br|bdrm)\b/i);return m?(+m[1]||WN[m[1].toLowerCase()]||0):0};
const bathsOf=t=>{const m=String(t||'').match(/\b(\d+)\s*[- ]?\s*bath(?:room)?s?\b/i);return m?+m[1]:0};
const toiletsOf=t=>{const m=String(t||'').match(/\b(\d+)\s*[- ]?\s*(?:toilets?|wc)\b/i);return m?+m[1]:0};
const parkingOf=t=>{const m=String(t||'').match(/\b(\d+)\s*[- ]?\s*(?:car\s*)?(?:parking|garage|car park)/i);return m?+m[1]:0};
const furnishOf=t=>{const z=String(t||'').toLowerCase();return /unfurnished/.test(z)?'un':/semi[- ]?furnished/.test(z)?'semi':/fully[- ]?furnished/.test(z)?'full':/\bfurnished\b/.test(z)?'any':''};
function amtOf(t){
 t=String(t||'').replace(/https?:\/\/\S+/g,' ').replace(new RegExp(PH.source,'g'),' ');

/* ---------- Photos and videos ----------
   Files are stored in the Supabase bucket "pm-media" under <workspace code>/<id>.<ext>. The pm-media function signs each upload
   and deletes files; the picture/video records sync like everything else. Pictures are resized before upload. */
const FN_URL=SB.url+'/functions/v1/pm-media',MEDIA_URL=p=>SB.url+'/storage/v1/object/public/pm-media/'+p;
async function fn(action,body){
 for(let i=0;;i++){
  const r=await fetch(FN_URL,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({ws:WS,action},body))});
  let j={};try{j=await r.json()}catch(e){}
  if(r.ok)return j;
  if(i<2&&/save a request or listing first/.test(j.error||'')){await new Promise(o=>setTimeout(o,1200));await flush();continue} // the owner may still be on its way to the server
  throw new Error(j.error||('HTTP '+r.status))}}
const mediaOf=(type,id)=>S.media.filter(m=>m.ownerType===type&&m.ownerId===id);
const VEXT={'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'},MAX_VIDEO_MB=25,MAX_VIDEO_SEC=60;
function imgToJpeg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no(new Error('Could not read this picture'))},'image/jpeg',.82)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Could not read this picture'))};im.src=u})}
function videoSeconds(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{const d=v.duration;URL.revokeObjectURL(u);ok(isFinite(d)?d:0)};v.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Could not read this video'))};v.src=u})}
async function addMedia(type,ownerId,files,statusEl){
 const errs=[];
 for(const f of Array.from(files)){
  try{
   let blob=f,kind,ext,dur=0;
   if((f.type||'').startsWith('image/')){kind='image';blob=await imgToJpeg(f);ext='jpg'}
   else if((f.type||'').startsWith('video/')){kind='video';ext=VEXT[f.type];if(!ext)throw new Error('use an MP4, WebM or MOV video');if(f.size>MAX_VIDEO_MB*1048576)throw new Error('videos must be under '+MAX_VIDEO_MB+' MB');dur=await videoSeconds(f);if(dur>MAX_VIDEO_SEC+1)throw new Error('videos must be '+MAX_VIDEO_SEC+' seconds or shorter')}
   else throw new Error('only pictures and short videos can be added');
   if(statusEl)statusEl.textContent='Uploading '+(f.name||kind)+'…';
   await flush();const id=newCode(),s=await fn('sign-upload',{id,ext}),fd=new FormData();
   fd.append('cacheControl','31536000');fd.append('',blob,id+'.'+ext);
   const r=await fetch(s.signedUrl,{method:'PUT',headers:{apikey:SB.key,'x-upsert':'false'},body:fd});
   if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||'upload failed ('+r.status+')')}
   S.media.push({id,ownerType:type,ownerId,path:s.path,kind,name:f.name||kind,size:blob.size,duration:dur||null,at:Date.now()});persist()
  }catch(e){errs.push((f.name||'File')+': '+e.message)}}
 return errs}

function queueFileDel(paths){FD=FD.concat(paths);lsSet('pm_filedel',JSON.stringify(FD));drainFileDel()}
async function drainFileDel(){if(!FD.length)return;const b=FD.slice(0,100);try{await fn('delete',{paths:b});FD=FD.slice(b.length);lsSet('pm_filedel',JSON.stringify(FD));if(FD.length)drainFileDel()}catch(e){}}
function dropMedia(type,id){const ms=mediaOf(type,id);if(!ms.length)return;queueFileDel(ms.map(m=>m.path));S.media=S.media.filter(m=>!(m.ownerType===type&&m.ownerId===id))}
function delMedia(id){const m=S.media.find(x=>x.id===id);if(!m||!confirm('Delete this '+(m.kind==='video'?'video':'picture')+'?'))return;S.media=S.media.filter(x=>x.id!==id);queueFileDel([m.path]);persist();if(SH.k==='media'){SH.idx=Math.max(0,Math.min(SH.idx,mediaOf(SH.type,SH.id).length-1));paintSheet()}render()}

const DAYMS=864e5;
function srFilter(o,isL){
 const tk=norm(SR.q).split(' ').filter(Boolean),f=[o.title,o.name,o.loc,o.state,o.country,o.kind,kl(o.kind),o.kindText,o.phone,o.contact,o.extra,o.desc].join(' '),h=norm(f);
 if(!tk.every(t=>h.includes(t)))return false;
 if(SR.tx&&normTx(o.tx)!==SR.tx)return false;
 if(SR.kind&&o.kind!==SR.kind)return false;
 if(SR.state&&!norm([o.state,o.loc].join(' ')).includes(norm(SR.state)))return false;
 let amt=+(isL?o.price:o.budget)||0;if(isL&&normTx(o.tx)==='rent'&&o.per==='month')amt*=12;
 if(SR.min&&!(amt>=+SR.min))return false;if(SR.max&&!(amt>0&&amt<=+SR.max))return false;
 if(SR.days&&!(Date.now()-(o.asOf||o.at||0)<=+SR.days*DAYMS))return false;
 if(SR.media&&!mediaOf(isL?'listing':'request',o.id).length)return false;
 return true}

function detectSource(raw){
 let s=String(raw||'').trim();if(!s)return null;

 if(/^\+?[\d\s()-]{9,20}$/.test(s)&&s.replace(/\D/g,'').length>=9){o.platform='whatsapp';o.kind='number';o.phone=s.replace(/[^\d+]/g,'');o.name=s.trim();o.url='https://wa.me/'+waNum(o.phone,'Nigeria');return o}
 if(/^@[A-Za-z0-9_.]{2,30}$/.test(s)){o.handle=s.slice(1);o.name=s;o.kind='profile';return o}
 if(!/^https?:\/\//i.test(s)&&/^[\w.-]+\.[a-z]{2,}(\/|\?|$)/i.test(s))s='https://'+s;

async function readFiles(inp){
 const files=Array.from(inp.files||[]);if(!files.length)return;const st=$('istat'),out=[];
 const buf=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Could not read the file'));r.readAsArrayBuffer(f)});
 const txt=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||''));r.onerror=()=>no(new Error('Could not read the file'));r.readAsText(f)});
 for(const f of files){
  const ext=(f.name.split('.').pop()||'').toLowerCase();let text='';
  try{
   if(ext==='txt'||ext==='csv')text=await txt(f);
   else if(ext==='pdf'){st.textContent='Reading '+f.name+'…';await loadLib('pdf');const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await buf(f))}).promise,pg=[];for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();pg.push(c.items.map(x=>x.str).join(' '))}text=pg.join('\n\n')}
   else if(ext==='docx'){st.textContent='Reading '+f.name+'…';await loadLib('docx');text=(await mammoth.extractRawText({arrayBuffer:await buf(f)})).value||''}
   else if(['jpg','jpeg','png','webp','bmp','gif'].includes(ext)||(f.type||'').startsWith('image/')){st.textContent='Loading the text reader…';await loadLib('ocr');const res=await Tesseract.recognize(f,'eng',{logger:x=>{if(x.status==='recognizing text')st.textContent='Reading '+f.name+' '+Math.round((x.progress||0)*100)+'%'}});text=(res.data&&res.data.text)||'';if(!text.trim())throw new Error('No readable text found. Try a clearer or larger screenshot.')}
   else if(ext==='doc')throw new Error('Old .doc files are not supported. Save it as .docx and add it again.');
   else throw new Error('This file type is not supported.');
   if(!text.trim())throw new Error('No selectable text found. A scanned PDF needs to be added as images instead.');
   out.push('--- '+f.name+' (file date '+ymd(f.lastModified||Date.now())+') ---\n'+text.trim());
  }catch(e){out.push('[Not imported: '+f.name+' – '+e.message+']')}
 }
 M.text=(M.text.trim()?M.text.trim()+'\n\n':'')+out.join('\n\n');M.msg='';render()}

 if(!keep.length){M.msg=ds.length?'No property messages found. '+ds.length+' message'+(ds.length===1?'':'s')+' skipped (chat, greetings or media).':'Paste a message or add a file first.';M.draft=null;render();return}

  h+=`<div class="grid"><div class="full"><label>Transaction category${d.needTx?' (choose one to save)':''}</label><select onchange="M.draft[${i}].tx=this.value">${opt('',d.tx,'Choose…')}${opt('rent',d.tx,'To rent / For rent / To let')}${opt('buy',d.tx,'To buy / For sale')}</select></div>`;
  if(q)h+=`<div><label>Client name</label><input value="${esc(d.name)}" oninput="M.draft[${i}].name=this.value"></div><div><label>Phone / WhatsApp</label><input value="${esc(d.phone)}" oninput="M.draft[${i}].phone=this.value"></div>`;
  else h+=`<div class="full"><label>Title</label><input value="${esc(d.title)}" oninput="M.draft[${i}].title=this.value"></div><div><label>Contact name</label><input value="${esc(d.contact)}" oninput="M.draft[${i}].contact=this.value"></div><div><label>Contact phone</label><input value="${esc(d.phone)}" oninput="M.draft[${i}].phone=this.value"></div>`;
  h+=`<div><label>Property type</label><select onchange="M.draft[${i}].kind=this.value">${opt('',d.kind,'Not stated')}${KINDS.filter(k=>k[0]!=='other').map(k=>opt(k[0],d.kind,k[1])).join('')}</select></div>
   <div><label>Area(s)</label><input value="${esc(d.loc)}" oninput="M.draft[${i}].loc=this.value"></div>
   <div><label>State / region</label><input value="${esc(d.state)}" oninput="M.draft[${i}].state=this.value"></div>
   <div><label>Country</label><input value="${esc(d.country)}" oninput="M.draft[${i}].country=this.value"></div>
   <div><label>${q?'Budget (per year if renting)':'Price'}</label><input inputmode="numeric" value="${esc(q?d.budget:d.price)}" oninput="M.draft[${i}].${q?'budget':'price'}=+this.value.replace(/\\D/g,'')||''"></div>
   <div><label>Currency</label><select onchange="M.draft[${i}].currency=this.value">${CURR.map(c=>opt(c,d.currency,c)).join('')}</select></div>`;
  if(!q)h+=`<div><label>Price is per</label><select onchange="M.draft[${i}].per=this.value">${['year','month','week','day'].map(p=>opt(p,d.per,p[0].toUpperCase()+p.slice(1))).join('')}</select></div>`;
  h+=`<div><label>${q?'Needed as at':'Date last available'} (${esc(d.asOfSrc||'')})</label><input type="date" value="${ymd(d.asOf)}" onchange="M.draft[${i}].asOf=fromYmd(this.value)||M.draft[${i}].asOf;M.draft[${i}].asOfSrc='set by you'"></div>
   <div class="full"><label>${q?'Additional requirements':'Description (features are read from here)'}</label><textarea oninput="M.draft[${i}].${q?'extra':'desc'}=this.value">${esc(q?d.extra:d.desc)}</textarea></div>`;
  return h+(d.needPrice?'<p class="err full">Add a price to save this listing.</p>':'')+'</div></div>'}).join('')+
 `<div class="acts"><button class="btn main block" onclick="saveDrafts()">Save selected</button></div>`}
function saveDrafts(){
 let rq=0,ls=0,dup=0,hold=0;const keep=[];
 M.draft.forEach(d=>{
  if(!d.ok||d.cls==='review'||d.cls==='ignore'){if(d.ok)hold++;keep.push(d);return}
  d.needTx=false;d.needPrice=false;
  if(!normTx(d.tx)){d.needTx=true;hold++;keep.push(d);return}
  const base={id:uid(),tx:d.tx,kind:d.kind||'',loc:d.loc,state:d.state,country:d.country||'Nigeria',currency:d.currency||'NGN',raw:d.raw,asOf:d.asOf||Date.now(),asOfSrc:d.asOfSrc||'import date',src:d.src,at:Date.now()};
  if(d.cls==='request'){
   if(S.reqs.some(r=>r.raw&&r.raw===d.raw&&(r.phone||'')===(d.phone||''))){dup++;return}
   S.reqs.unshift(Object.assign(base,{name:d.name,phone:d.phone,kindText:'',budget:+d.budget||'',extra:d.extra}));rq++}
  else{
   if(!(+d.price>0)){d.needPrice=true;hold++;keep.push(d);return}
   if(S.lsts.some(l=>l.raw&&l.raw===d.raw&&(l.phone||'')===(d.phone||''))){dup++;return}
   S.lsts.unshift(Object.assign(base,{title:d.title||'Property',price:+d.price,per:d.per||'year',beds:d.beds||'',phone:d.phone,contact:d.contact||'',desc:d.desc}));ls++}
 });
 rematchAll();persist();M.draft=keep.length?keep:null;if(!keep.length)M.text='';
 const n=[];if(rq)n.push(rq+' request'+(rq>1?'s':'')+' saved');if(ls)n.push(ls+' listing'+(ls>1?'s':'')+' saved');if(dup)n.push(dup+' already saved');if(hold)n.push(hold+' still need a category or price');
 M.msg=n.join('. ')+(n.length?'.':'Nothing was selected to save.');render()}
const stale=ts=>Date.now()-ts>30*864e5;
const asOfLine=(o,verb)=>{const ts=o.asOf||o.at;if(!ts)return '';const old=stale(ts);return `<p class="asof${old?' old':''}">${verb} as at ${dateTxt(ts)} (${agoTxt(ts)}${o.asOfSrc?', '+o.asOfSrc:''})${old?'. Older than 30 days, so confirm it is still available.':''}</p>`};
function touchLst(id){const l=S.lsts.find(x=>x.id===id);if(l){l.asOf=Date.now();l.asOfSrc='confirmed by you';persist();render()}}

function saveLst(){const i=S.lsts.findIndex(x=>x.id===editingLst);if(i<0)return;if(!normTx(LE.tx)||!(+LE.price>0)){alert('Choose a category and enter a price.');return}S.lsts[i]=Object.assign(S.lsts[i],LE,{price:+LE.price,title:LE.title||'Property'});rematchAll();persist();editingLst=null;LE=null;render()}

 <div><label>Property type</label><select onchange="LE.kind=this.value">${opt('',e.kind,'Not stated')}${KINDS.filter(k=>k[0]!=='other').map(k=>opt(k[0],e.kind,k[1])).join('')}</select></div>
 <div><label>Area(s)</label><input value="${esc(e.loc)}" oninput="LE.loc=this.value"></div>
 <div><label>State / region</label><input value="${esc(e.state)}" oninput="LE.state=this.value"></div>
 <div><label>Country</label><input value="${esc(e.country)}" oninput="LE.country=this.value"></div>
 <div><label>Price</label><input inputmode="numeric" value="${esc(e.price)}" oninput="LE.price=+this.value.replace(/\\D/g,'')||''"></div>
 <div><label>Currency</label><select onchange="LE.currency=this.value">${CURR.map(c=>opt(c,e.currency,c)).join('')}</select></div>
 <div><label>Price is per</label><select onchange="LE.per=this.value">${['year','month','week','day'].map(p=>opt(p,e.per,p[0].toUpperCase()+p.slice(1))).join('')}</select></div><div><label>Date last available</label><input type="date" value="${ymd(e.asOf||e.at||Date.now())}" onchange="LE.asOf=fromYmd(this.value)||LE.asOf;LE.asOfSrc='set by you'"></div>
 <div><label>Contact phone</label><input value="${esc(e.phone)}" oninput="LE.phone=this.value"></div>
 <div class="full"><label>Description (features such as borehole or C of O are read from here)</label><textarea oninput="LE.desc=this.value">${esc(e.desc)}</textarea></div></div>
 <div class="acts"><button class="btn sm main" onclick="saveLst()">Save changes</button><button class="btn sm" onclick="editingLst=null;LE=null;render()">Cancel</button></div></div>`}
function del(k,id){if(!confirm('Delete this '+(k==='req'?'client':'property')+'?'))return;if(k==='req'){dropMedia('request',id);S.reqs=S.reqs.filter(r=>r.id!==id);S.matches=S.matches.filter(m=>m.reqId!==id);if(activeReq===id){activeReq=null;sub='form'}}else{dropMedia('listing',id);S.lsts=S.lsts.filter(l=>l.id!==id);S.matches=S.matches.filter(m=>m.lstId!==id)}persist();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='property-matchmaker-backup.json';a.click()}
function importData(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.reqs)&&!Array.isArray(d.lsts))throw 0;S={reqs:d.reqs||[],lsts:d.lsts||[],matches:d.matches||[],media:d.media||[],sources:d.sources||[]};fixKinds();persist();render()}catch(e){alert('That file is not a Property Matchmaker backup.')}};r.readAsText(f)}
